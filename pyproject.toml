[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-fund-tracer"
version = "1.2.0"
description = "Follow money on Solana: to its source, to the exchange, through relay chains; HTML case reports with Solscan links. Read-only."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Artem Vartanov"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fundtrace = "fundtrace.__main__:main"

[tool.setuptools]
packages = ["fundtrace"]
